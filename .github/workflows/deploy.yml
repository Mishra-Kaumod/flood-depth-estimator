name: Deploy Flood Inference to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
  ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME || 'flood-inference' }}
  ECS_MIN_CAPACITY: ${{ vars.ECS_MIN_CAPACITY || '2' }}
  ECS_MAX_CAPACITY: ${{ vars.ECS_MAX_CAPACITY || '12' }}

jobs:
  quality-gate:
    name: Model Readiness Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install quality gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-local.txt
          pip install "opencv-python-headless>=4.9.0.80"

      - name: Build enterprise labeled manifest
        run: |
          python create_labeled_manifest.py \
            --source test_images/evaluation_manifest_ai_seeded.csv \
            --output test_images/evaluation_manifest_labeled.csv

      - name: Validate Gemini peak-season quota guardrail
        run: |
          python - <<'PY'
          import yaml
          cfg = yaml.safe_load(open("config/config.yaml", "r", encoding="utf-8"))
          budget = cfg.get("inference", {}).get("gemini", {}).get("budget", {})
          quota = int(budget.get("verified_quota_per_minute", 0))
          peak = int(budget.get("peak_season_expected_concurrency", 0))
          if quota <= 0:
              raise SystemExit("verified_quota_per_minute must be configured > 0")
          if peak <= 0:
              raise SystemExit("peak_season_expected_concurrency must be configured > 0")
          if quota < peak:
              raise SystemExit(
                  f"Gemini quota too low for configured peak concurrency: quota={quota} < peak={peak}"
              )
          print({"verified_quota_per_minute": quota, "peak_season_expected_concurrency": peak})
          PY

      # Rewritten from the Django-era evaluator to the Flask SegFormer pipeline on 2026-08-02.
      - name: Run readiness quality gate
        run: |
          python evaluate_model_readiness.py \
            --input-dir test_images \
            --manifest test_images/evaluation_manifest_labeled.csv \
            --enforce-gates \
            --min-labeled-flood 50 \
            --min-labeled-depth 20 \
            --min-barren 25 \
            --min-f1 0.90 \
            --max-depth-mae 15 \
            --min-depth-labels-per-band 3 \
            --max-mae-0-20 8 \
            --max-mae-20-50 12 \
            --max-mae-50-80 15 \
            --max-mae-80-plus 20 \
            --max-barren-fp-rate 0.05 \
            --max-p95-latency 8 \
            --max-contradictions 0

  shadow-canary:
    name: Shadow Canary (candidate vs production)
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install canary dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-local.txt

      - name: Build enterprise labeled manifest
        run: |
          python create_labeled_manifest.py \
            --source test_images/evaluation_manifest_ai_seeded.csv \
            --output test_images/evaluation_manifest_labeled.csv

      - name: Run shadow canary comparison
        run: |
          python scripts/shadow_canary_check.py \
            --production-model models/best_flood_model_water_aware.pth \
            --candidate-model models/candidate/best_flood_model_water_aware_candidate.pth \
            --manifest test_images/evaluation_manifest_labeled.csv \
            --sample-size 100 \
            --max-mean-depth-delta-cm 15 \
            --max-severity-drift-rate 0.15

  preseason-load-test:
    name: Preseason Peak-Day Load Test (May)
    runs-on: ubuntu-latest
    needs: quality-gate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      LOAD_TEST_TARGET_URL: ${{ vars.PEAK_LOAD_TEST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install load test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run preseason load test rehearsal when in May
        run: |
          MONTH="$(date -u +%m)"
          if [ "$MONTH" != "05" ]; then
            echo "Not May (UTC month=$MONTH); skipping preseason load test."
            exit 0
          fi
          if [ -z "$LOAD_TEST_TARGET_URL" ]; then
            echo "PEAK_LOAD_TEST_URL is not set; skipping preseason load test."
            exit 0
          fi
          python scripts/load_test_peak_day.py \
            --target-url "$LOAD_TEST_TARGET_URL" \
            --image-dir test_images \
            --max-images 300 \
            --concurrency 25 \
            --max-p95-ms 8000 \
            --min-success-rate 0.95

  deploy:
    name: Build, Push, Deploy
    runs-on: ubuntu-latest
    needs: [quality-gate, shadow-canary]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate required CI/CD variables
        run: |
          test -n "${ECR_REPOSITORY}" || (echo "Missing repo variable: ECR_REPOSITORY" && exit 1)
          test -n "${ECS_CLUSTER}" || (echo "Missing repo variable: ECS_CLUSTER" && exit 1)
          test -n "${ECS_SERVICE}" || (echo "Missing repo variable: ECS_SERVICE" && exit 1)
          test -n "${ECS_TASK_DEFINITION}" || (echo "Missing repo variable: ECS_TASK_DEFINITION" && exit 1)
          test -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" || (echo "Missing secret: AWS_ROLE_TO_ASSUME" && exit 1)

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate OIDC least-privilege guardrails
        run: |
          aws sts get-caller-identity
          test -n "${{ vars.ECR_REPOSITORY }}" || (echo "Missing ECR_REPOSITORY for scoped push policy" && exit 1)
          test -n "${{ vars.ECS_CLUSTER }}" || (echo "Missing ECS_CLUSTER for scoped deploy policy" && exit 1)
          test -n "${{ vars.ECS_SERVICE }}" || (echo "Missing ECS_SERVICE for scoped deploy policy" && exit 1)
          test -n "${{ vars.ECS_TASK_DEFINITION }}" || (echo "Missing ECS_TASK_DEFINITION for scoped deploy policy" && exit 1)
          echo "OIDC role assumed. Ensure IAM policy is limited to this ECR repo and ECS service/task definition."


      - name: Enforce repository hygiene (quarantine non-production files)
        run: |
          echo "=== Phase 6: Production file audit ==="
          for f in app.py scripts/tasks.py scripts/mc_dropout.py scripts/serve.py Dockerfile pyproject.toml; do
            test -f "$f" || (echo "ERROR: Missing production file: $f" && exit 1)
          done
          if ls Retrain_*.py colab_*.py retrain_*.py 2>/dev/null | grep -v archived; then
            echo "ERROR: Legacy scripts found outside archived/. Move them first."
            exit 1
          fi
          echo "Repository hygiene check passed."

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate inference requirements
        run: |
          cat > requirements.inference.txt <<'EOF'
          torch>=2.0.0
          torchvision>=0.15.0
          pillow>=9.5.0
          numpy>=1.23.0
          pyyaml>=6.0
          litserve>=0.1.0
          EOF

      - name: Use committed Dockerfile (Phase 6)
        run: |
          echo "Using committed Dockerfile"
          test -f Dockerfile || (echo "ERROR: Dockerfile missing" && exit 1)

      - name: Build and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          IMAGE_URI_LATEST="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          docker build -f Dockerfile -t "${IMAGE_URI}" -t "${IMAGE_URI_LATEST}" .
          docker push "${IMAGE_URI}"
          docker push "${IMAGE_URI_LATEST}"
          echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${ECS_TASK_DEFINITION}" \
            --query taskDefinition > task-definition.json

          jq 'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )' task-definition.json > task-definition-clean.json

      - name: Render new ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-clean.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS service (Fargate)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Configure ECS Application Auto Scaling
        run: |
          RESOURCE_ID="service/${ECS_CLUSTER}/${ECS_SERVICE}"
          aws application-autoscaling register-scalable-target \
            --service-namespace ecs \
            --resource-id "${RESOURCE_ID}" \
            --scalable-dimension ecs:service:DesiredCount \
            --min-capacity "${ECS_MIN_CAPACITY}" \
            --max-capacity "${ECS_MAX_CAPACITY}"

          aws application-autoscaling put-scaling-policy \
            --service-namespace ecs \
            --resource-id "${RESOURCE_ID}" \
            --scalable-dimension ecs:service:DesiredCount \
            --policy-name flood-service-cpu-target-tracking \
            --policy-type TargetTrackingScaling \
            --target-tracking-scaling-policy-configuration \
              '{
                "TargetValue": 55.0,
                "PredefinedMetricSpecification": {"PredefinedMetricType": "ECSServiceAverageCPUUtilization"},
                "ScaleOutCooldown": 60,
                "ScaleInCooldown": 180
              }'

      - name: Configure seasonal scheduled scaling (Jun-Sep up, Oct down)
        run: |
          RESOURCE_ID="service/${ECS_CLUSTER}/${ECS_SERVICE}"
          aws application-autoscaling put-scheduled-action \
            --service-namespace ecs \
            --scheduled-action-name flood-monsoon-scale-up-june \
            --resource-id "${RESOURCE_ID}" \
            --scalable-dimension ecs:service:DesiredCount \
            --schedule "cron(0 0 1 6 ? *)" \
            --scalable-target-action MinCapacity=4,MaxCapacity=16

          aws application-autoscaling put-scheduled-action \
            --service-namespace ecs \
            --scheduled-action-name flood-post-monsoon-scale-down-october \
            --resource-id "${RESOURCE_ID}" \
            --scalable-dimension ecs:service:DesiredCount \
            --schedule "cron(0 0 1 10 ? *)" \
            --scalable-target-action MinCapacity=2,MaxCapacity=8
